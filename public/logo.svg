<rect width="1000" height="1000" rx="140" fill="url(#bg)"/>

<circle cx="500" cy="420" r="330" fill="#1e88e5" opacity="0.12"/>
<circle cx="500" cy="420" r="240" fill="#29b6f6" opacity="0.08"/>

